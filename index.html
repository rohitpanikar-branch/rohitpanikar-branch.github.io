<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rohit's WebSDK Testing</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
    background: #f5f5f5;
  }
  h1 {
    color: #222;
  }
  .button-row {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
  }
  button {
    padding: 12px 24px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #4a90e2;
    color: white;
  }
  .product-card {
    background: white;
    border-radius: 8px;
    padding: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    text-align: center;
    width: 220px;
    margin-bottom: 20px;
  }
  .product-card img {
    width: 100px;
    height: 100px;
  }
  #purchase-btn {
    background: #2ecc71;
  }
</style>
</head>
<body>
  <h1>Rohit's WebSDK Testing</h1>

  <div class="button-row">
    <button id="create-btn">Create</button>
    <button id="share-btn">Share</button>
  </div>

  <div class="product-card">
    <div style="font-size: 64px;">⛳️</div>
    <h3>Golf Ball</h3>
    <p>$2.99</p>
  </div>

  <button id="purchase-btn">Purchase</button>

</body>
</html>
