        /* Top Navigation Banner */

            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);

        .brand-title {
            font-size: 17px;

            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .hamburger-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Slide-out Mobile Menu */
        .mobile-menu {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: #ffffff;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
            transition: left 0.3s ease;
            z-index: 1100;
            display: flex;
            flex-direction: column;
        }

        .mobile-menu.open {
            left: 0;
        }

        .menu-header {
            background-color: #1c4532;
            color: white;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .menu-links {
            list-style: none;
            padding: 10px 0;
        }

        .menu-links li a {
            display: block;
            padding: 16px 20px;
            color: #333;
            text-decoration: none;
            font-size: 16px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s, color 0.2s;
        }

        .menu-links li a:hover {
            background-color: #f4f6f4;
            color: #1c4532;
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 1050;
        }

        .menu-overlay.active {
            display: block;
        }

        /* Main Content Container */
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            color: #2c3e50; 
            font-size: 19px; 
            margin-top: 0;
            margin-bottom: 20px; 
            text-transform: uppercase;

        }
        
        label { 
            display: block; 
            margin-bottom: 6px; 
            color: #4a5568; 
            font-size: 14px; 
            font-weight: 500;
        }
        
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #cbd5e0; 
            border-radius: 6px; 
            font-size: 16px;
            background: #fff;
        }
        
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #276749;
        }
        
        button.login-btn { 
            width: 100%; 
            padding: 14px; 
            background-color: #276749; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            margin-top: 10px; 
            transition: background-color 0.2s;

<body>

    <!-- Top Banner -->
    <header class="top-banner">
        <button class="hamburger-btn" id="menuToggle" aria-label="Open Menu">&#9776;</button>
        <div class="brand-title">ForeTees Country Club</div>
        <div style="width: 24px;"></div> <!-- Balances layout alignment -->
    </header>

    <!-- Slide-out Menu Panel -->
    <div class="menu-overlay" id="menuOverlay"></div>
    <nav class="mobile-menu" id="mobileMenu">
        <div class="menu-header">
            <span>Menu</span>
            <button class="close-btn" id="menuClose">&times;</button>
        </div>
        <ul class="menu-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Tee Times</a></li>
            <li><a href="#">Dining & Events</a></li>
            <li><a href="#">Member Directory</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>
    </nav>

    <!-- Content Container -->
    <div class="main-container">
        <div class="container">
            <h1>Member Login</h1>
            <div class="form-group">
                <label for="username">Member ID</label>
                <input type="text" id="username" placeholder="Enter your Member ID">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>
            <button type="button" class="login-btn">Log In</button>
        </div>
    </div>

    <!-- Toggle Script for Hamburger Menu -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const menuClose = document.getElementById('menuClose');
        const mobileMenu = document.getElementById('mobileMenu');
        const menuOverlay = document.getElementById('menuOverlay');

        function toggleMenu() {
            mobileMenu.classList.toggle('open');
            menuOverlay.classList.toggle('active');
        }

        menuToggle.addEventListener('click', toggleMenu);
        menuClose.addEventListener('click', toggleMenu);
        menuOverlay.addEventListener('click', toggleMenu);
    </script>
